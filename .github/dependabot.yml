# Weekly dependency PRs. Each lands as its own pull request and has to pass the
# full CI floor — including the route-guard gates — before a human merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps arrive as one PR; majors stay separate and visible.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every pinned action in ci.yml and codeql.yml bumps in one PR instead of
      # five. The first weekly run opened five separate PRs (checkout,
      # setup-node, gitleaks, codeql, claude-code-action); each needs the same
      # review -- does the new SHA match the tag -- so they belong together.
      actions:
        patterns: ['*']
