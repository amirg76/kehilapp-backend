# Static analysis (SAST): GitHub scans the source for injection flows, tainted
# data reaching dangerous sinks, prototype pollution and the rest of the CWE
# catalogue. Free on public repositories. Findings land in the Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan: new query packs catch old code.
    - cron: '30 4 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
